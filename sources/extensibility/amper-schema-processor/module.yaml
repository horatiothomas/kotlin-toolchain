product: jvm/lib

description: An executable processor that generates plugin descriptors from plugin sources.

apply:
  - ../../common.module-template.yaml
  - ../uses-aa.module-template.yaml

settings:
  kotlin:
    serialization: json
  jvm:
    test:
      systemProperties:
        ide.can.use.coroutines.fork: false

dependencies:
  - ../../amper-telemetry
  - ../amper-schema-processing
  - $libs.kotlin.analysis.api.standalone.for.ide

test-dependencies:
  - ../../test-base
  - ../amper-extensibility-api
  - ../amper-extensibility-sdk-stub: runtime-only
  - com.intellij.platform:kotlinx-coroutines-core-jvm:1.10.1-intellij-5
